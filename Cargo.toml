[workspace]

members = [
    "lib",
    "daemon",
    "check",
    "rootshell",
    "telcom-parser",
    "installer",
    "installer-gui/src-tauri",
]
# at least for now, let's keep installer-gui out of the list of default
# packages. installer-gui is still experimental and requires many new packages
# both from cargo and the underlying operating system
default-members = [
    "lib",
    "daemon",
    "check",
    "rootshell",
    "telcom-parser",
    "installer",
]
resolver = "2"

[patch.crates-io]
asn1_codecs_derive = { path = "sentinel-vendor/asn1_codecs_derive-0.7.1" }

[patch."https://github.com/EFForg/pycrate-rs"]
pycrate-rs = { path = "sentinel-vendor/pycrate-rs-9e72e40bee9c3c09205ad871cf681628b443de7c" }
